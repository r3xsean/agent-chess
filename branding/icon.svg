<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#3d3b37"/>
      <stop offset="60%" stop-color="#262522"/>
      <stop offset="100%" stop-color="#161513"/>
    </radialGradient>
    <pattern id="squares" width="128" height="128" patternUnits="userSpaceOnUse">
      <rect width="128" height="128" fill="#ebecd0"/>
      <rect width="64" height="64" fill="#739552"/>
      <rect x="64" y="64" width="64" height="64" fill="#739552"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fadeMask"><rect width="1024" height="1024" fill="url(#fade)"/></mask>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d9d8d3"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="30" y="30" width="84" height="84">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="knightClip">
      <path id="knightPath" d="M58 168 C62 148 78 134 92 122 C80 124 66 128 54 130 C44 131 36 128 33 121 L26 112 C22 106 24 98 30 93 L64 58 C70 46 80 38 90 34 L96 14 L106 32 C140 38 162 70 162 110 C162 135 156 152 150 168 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#squares)" mask="url(#fadeMask)"/>

  <!-- green ring -->
  <circle cx="512" cy="512" r="445" fill="none" stroke="#81b64c" stroke-width="10" stroke-opacity="0.35"/>

  <g transform="translate(512 520) scale(3.4) translate(-96 -100)" filter="url(#shadow)">
    <use href="#knightPath" fill="url(#body)" stroke="#1e1d1a" stroke-width="5" stroke-linejoin="round"/>
    <!-- base -->
    <rect x="40" y="166" width="132" height="24" rx="7" fill="url(#body)" stroke="#1e1d1a" stroke-width="5"/>
    <rect x="50" y="160" width="112" height="10" rx="4" fill="#81b64c" stroke="#1e1d1a" stroke-width="4"/>

    <!-- circuit traces across the head -->
    <g clip-path="url(#knightClip)" fill="none" stroke="#81b64c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M76 70 L104 70 L118 56 L170 56"/>
      <path d="M76 74 L96 94 L130 94 L144 108 L170 108"/>
      <path d="M110 120 L120 130 L170 130"/>
      <path d="M118 80 L170 80"/>
    </g>
    <g fill="#1e1d1a" stroke="#81b64c" stroke-width="3">
      <circle cx="118" cy="56" r="4.5"/>
      <circle cx="130" cy="94" r="4.5"/>
      <circle cx="118" cy="80" r="4.5"/>
      <circle cx="110" cy="120" r="4.5"/>
    </g>
    <!-- nostril -->
    <path d="M34 104 Q38 100 42 103" fill="none" stroke="#1e1d1a" stroke-width="3.5" stroke-linecap="round"/>
    <!-- glowing eye -->
    <circle cx="72" cy="72" r="9" fill="#a3d160" filter="url(#glow)"/>
    <circle cx="72" cy="72" r="4" fill="#f4ffe0"/>
  </g>
</svg>
